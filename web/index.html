<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo Culler</title>
  <link rel="stylesheet" href="/static/app.css?v=1.0.0-ui7">
</head>
<body>
  <header class="topbar">
    <div class="brand"><button id="homeBtn" class="logo" title="返回首页" aria-label="返回首页">⌂</button></div>
    <div class="top-actions">
      <select id="profileSelect" class="project-only-action" title="分析模式"></select>
      <button id="scanBtn" class="project-only-action">开始扫描</button>
      <button id="settingsBtn" class="ghost project-only-action">设置</button>
      <button id="themeBtn" class="icon-button ghost" title="切换夜间模式" aria-label="切换夜间模式">
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.6 8.6 0 0 1 8.6 3.8 8.8 8.8 0 1 0 20.2 15.4Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="githubBtn" class="icon-button ghost" title="打开 GitHub 仓库" aria-label="打开 GitHub 仓库">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.3 11.3 0 0 0 8.4 22.8c.6.1.8-.3.8-.6v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="home" class="home">
      <div class="hero">
        <div><p class="eyebrow">从任意照片文件夹开始</p><h1><span>快速留下</span><span>美好瞬间</span></h1>
          <p>递归扫描常见图片、HEIC/HEIF 与相机 RAW。所有分析均在本机完成。</p>
          <button id="chooseBtn" class="primary hero-choose">选择照片文件夹</button>
        </div>
        <!-- <div class="hero-art" aria-hidden="true"><span><b>JPG</b><small>STANDARD</small></span><span><b>HEIC</b><small>MOBILE</small></span><span><b>RAW</b><small>CAMERA</small></span></div> -->
      </div>
      <section class="recent-panel" aria-labelledby="recentTitle">
        <div class="section-title recent-title-row">
          <h2 id="recentTitle">最近项目</h2>
          <label class="recent-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input id="recentSearch" type="search" placeholder="搜索项目名称" aria-label="搜索最近项目名称">
          </label>
        </div>
        <div id="recentList" class="recent-grid"></div>
      </section>
    </section>

    <section id="workspace" class="workspace hidden">
      <aside>
        <div id="projectBox" class="project-box" role="button" tabindex="0" title="双击在文件管理器中打开" aria-label="当前项目，双击在文件管理器中打开"><small>当前项目</small><b id="projectName"></b><span id="projectPath"></span></div>
        <nav id="nav">
          <button data-nav="library" data-preset="library" class="active">照片库 <em id="libraryCount">0</em></button>
          <span class="nav-section-label">智能整理</span>
          <button data-nav="ai" data-preset="ai">AI建议 <em id="aiCount">0</em></button>
          <button data-nav="similar" data-view="similar">相似连拍 <em id="pairCount">0</em></button>
          <span class="nav-section-label">我的处理</span>
          <button data-nav="undecided" data-preset="undecided">待决定 <em id="undecidedCount">0</em></button>
          <button data-nav="keep" data-preset="keep">已保留 <em id="keepCount">0</em></button>
          <button data-nav="remove" data-preset="remove">已移除 <em id="removeCount">0</em></button>
          <span class="nav-section-label">问题</span>
          <button data-nav="unreadable" data-view="unreadable">无法读取 <em id="unreadableCount">0</em></button>
          <button data-nav="quarantine" data-view="quarantine">隔离历史</button>
        </nav>
        <div class="aside-actions">
          <div class="csv-actions">
            <button id="importBtn" class="ghost">导入 CSV</button>
            <button id="exportBtn" class="ghost">导出 CSV</button>
          </div>
          <button id="clearDecisionsBtn" class="ghost">清空所有选择</button>
          <button id="quarantineBtn" class="danger">隔离已标记移除</button>
        </div>
      </aside>
      <section class="content">
        <div id="progressPanel" class="progress-panel hidden">
          <div><b id="progressTitle">正在扫描</b><span id="progressDetail"></span></div>
          <div class="progress-track"><i id="progressBar"></i></div>
          <button id="cancelBtn" class="ghost">取消</button>
        </div>
        <div class="toolbar">
          <div><h2 id="viewTitle">照片库</h2><span id="viewSubtitle"></span></div>
          <div id="libraryFilters" class="library-filters">
            <div class="multi-filter" data-filter-menu="decisions">
              <button class="multi-filter-trigger" type="button" aria-expanded="false" aria-controls="decisionFilterPanel">
                <span>决定状态</span><b id="decisionFilterSummary">全部</b><svg class="filter-chevron" viewBox="0 0 18 18" aria-hidden="true"><path d="m5 7 4 4 4-4"/></svg>
              </button>
              <div id="decisionFilterPanel" class="multi-filter-panel hidden">
                <div class="multi-filter-head"><b>决定状态</b><button type="button" data-select-all="decisions">全选</button></div>
                <label><input type="checkbox" data-filter-group="decisions" value="undecided" checked>未决定</label>
                <label><input type="checkbox" data-filter-group="decisions" value="keep" checked>已保留</label>
                <label><input type="checkbox" data-filter-group="decisions" value="remove" checked>已移除</label>
              </div>
            </div>
            <div class="multi-filter" data-filter-menu="ai">
              <button class="multi-filter-trigger" type="button" aria-expanded="false" aria-controls="aiFilterPanel">
                <span>AI 分析</span><b id="aiFilterSummary">全部</b><svg class="filter-chevron" viewBox="0 0 18 18" aria-hidden="true"><path d="m5 7 4 4 4-4"/></svg>
              </button>
              <div id="aiFilterPanel" class="multi-filter-panel hidden">
                <div class="multi-filter-head"><b>AI 分析</b><button type="button" data-select-all="ai">全选</button></div>
                <label><input type="checkbox" data-filter-group="ai" value="remove" checked>建议移除</label>
                <label><input type="checkbox" data-filter-group="ai" value="review" checked>人工复查</label>
                <label><input type="checkbox" data-filter-group="ai" value="no_suggestion" checked>无建议</label>
              </div>
            </div>
          </div>
          <div id="aiBatchAction" class="ai-batch-action hidden">
            <button id="markAiRemoveBtn" class="ai-sweep-button" type="button" aria-label="将所有 AI 建议移除的未决定照片标记为移除" title="仅标记为移除，不会立即移动照片文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M8 10v7M12 10v7M16 10v7M7 7l1 13h8l1-13"/></svg>
              <span>一键移除</span>
              <em id="aiRemovePendingCount">0</em>
            </button>
          </div>
          <div id="similarViewActions" class="similar-toolbar-actions hidden">
            <button id="similarCollapseBtn" class="ghost">‹ 收回</button>
            <button id="similarExpandBtn" class="ghost">展开</button>
            <button id="similarBackBtn" class="ghost hidden">‹ 返回相似组</button>
          </div>
          <label class="search"><span>⌕</span><input id="searchInput" placeholder="搜索文件名或路径"></label>
        </div>
        <div id="gallery" class="gallery"></div>
        <div id="librarySentinel" class="library-sentinel hidden" aria-live="polite"></div>
        <section id="similarBrowser" class="similar-browser hidden">
          <div id="similarFolderPane" class="similar-folder-pane">
            <div id="similarFolders" class="similar-folders"></div>
          </div>
          <section id="similarDetail" class="similar-detail hidden">
            <div id="similarDetailGallery" class="gallery similar-detail-gallery"></div>
          </section>
        </section>
        <div id="empty" class="empty hidden"><b id="emptyTitle">这里还没有内容</b><span id="emptyText">扫描完成后会显示结果。</span></div>
      </section>
    </section>
  </main>

  <dialog id="viewer" class="viewer">
    <button class="close" data-close aria-label="关闭预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="side prev" id="viewerPrev" aria-label="上一张"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <figure><img id="viewerImage" draggable="false"><figcaption><div class="viewer-title-line"><span id="viewerBadge" class="viewer-badge hidden"></span><b id="viewerName"></b></div><span id="viewerMeta"></span></figcaption></figure>
    <button class="side next" id="viewerNext" aria-label="下一张"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <footer><button id="viewerKeep" class="viewer-decision viewer-keep">W / ↑ 保留</button><span id="viewerIndex"></span><button id="viewerRemove" class="viewer-decision viewer-remove">S / ↓ 移除</button></footer>
  </dialog>

  <dialog id="settings" class="panel-dialog">
    <div class="dialog-head"><h2>设置与分析模式</h2>
      <button data-close>
        <svg width="16" height="16">
          <line x1="3" y1="3" x2="13" y2="13"/>
          <line x1="13" y1="3" x2="3" y2="13"/>
        </svg></button></div>
    <div class="settings-tabs"><button data-setting="general" class="active">常规与存储</button><button data-setting="profiles">自定义模式</button></div>
    <section id="generalSettings" class="settings-page">
      <label class="toggle"><input id="autoAdvance" type="checkbox"><span>标记后自动下一张</span></label>
      <div class="update-row">
        <label class="toggle"><input id="autoCheckUpdates" type="checkbox"><span>启动时自动检查更新</span><button id="checkUpdateBtn">检查更新</button><span id="updateStatus" role="status"></span></label>
      </div>
      <label>全局默认数据库与缩略图位置<div class="path-row"><input id="defaultCache" readonly><button id="defaultCacheBtn">选择</button></div></label>
      <label>当前项目存储位置<div class="path-row"><input id="projectCache" readonly><button id="projectCacheBtn">迁移</button></div></label>
      <div id="oldCaches"></div>
    </section>
    <section id="profileSettings" class="settings-page hidden">
      <div class="profile-toolbar"><select id="profileEditorSelect"></select><button id="cloneProfile">复制为自定义</button><button id="deleteProfile" class="danger">删除</button></div>
      <label>配置名称：<input id="profileName" maxlength="40"></label>
      <div class="form-grid">
        <label>阈值方式<select data-p="quality.threshold_mode"><option value="absolute">绝对阈值</option><option value="percentile">照片集百分位（清晰度）</option></select></label>
        <label>异常组合<select data-p="quality.match_mode"><option value="any">任一异常</option><option value="all">至少两项异常</option></select></label>
        <label>清晰度复看阈值<input type="number" data-p="quality.blur_review" min="0" max="10000"></label>
        <label>清晰度移除阈值<input type="number" data-p="quality.blur_remove" min="0" max="10000"></label>
        <label>偏暗亮度阈值<input type="number" data-p="quality.dark_review" min="0" max="255"></label>
        <label>严重欠曝阈值<input type="number" data-p="quality.dark_remove" min="0" max="255"></label>
        <label>高光复看比例<input type="number" step=".01" data-p="quality.bright_clip_review" min="0" max="1"></label>
        <label>高光移除比例<input type="number" step=".01" data-p="quality.bright_clip_remove" min="0" max="1"></label>
        <label>对比度复看<input type="number" data-p="quality.contrast_review" min="0" max="128"></label>
        <label>对比度移除<input type="number" data-p="quality.contrast_remove" min="0" max="128"></label>
        <label>细节复看<input type="number" step=".1" data-p="quality.entropy_review" min="0" max="8"></label>
        <label>细节移除<input type="number" step=".1" data-p="quality.entropy_remove" min="0" max="8"></label>
        <label>最低复看分辨率(MP)<input type="number" step=".1" data-p="quality.min_megapixels_review"></label>
        <label>最低移除分辨率(MP)<input type="number" step=".1" data-p="quality.min_megapixels_remove"></label>
        <label>最低复看文件大小(KB)<input type="number" data-p="quality.min_size_kb_review"></label>
        <label>最低移除文件大小(KB)<input type="number" data-p="quality.min_size_kb_remove"></label>
        <label>清晰度复看百分位<input type="number" data-p="quality.blur_review_percentile" min="0" max="100"></label>
        <label>清晰度移除百分位<input type="number" data-p="quality.blur_remove_percentile" min="0" max="100"></label>
        <label>清晰度评分权重<input type="number" step=".01" data-p="quality.weights.sharpness" min="0" max="10"></label>
        <label>曝光评分权重<input type="number" step=".01" data-p="quality.weights.exposure" min="0" max="10"></label>
        <label>对比度评分权重<input type="number" step=".01" data-p="quality.weights.contrast" min="0" max="10"></label>
        <label>细节评分权重<input type="number" step=".01" data-p="quality.weights.entropy" min="0" max="10"></label>
        <label>分辨率评分权重<input type="number" step=".01" data-p="quality.weights.resolution" min="0" max="10"></label>
        <label>pHash 最大距离<input type="number" data-p="similarity.phash_max" min="0" max="64"></label>
        <label>dHash 最大距离<input type="number" data-p="similarity.dhash_max" min="0" max="64"></label>
        <label>最低结构相似度<input type="number" step=".01" data-p="similarity.structure_min" min="-1" max="1"></label>
        <label>宽高比容差<input type="number" step=".01" data-p="similarity.aspect_tolerance" min="0" max="1"></label>
        <label>拍摄时间窗口(分钟)<input type="number" data-p="similarity.time_window_minutes"></label>
        <label>文件序列间隔<input type="number" data-p="similarity.sequence_gap"></label>
        <label>最小分组数量<input type="number" data-p="similarity.min_group_size" min="2"></label>
      </div>
      <div class="check-grid">
        <label><input type="checkbox" data-p="quality.enabled.sharpness">启用清晰度</label>
        <label><input type="checkbox" data-p="quality.enabled.luminance">启用亮度/暗部</label>
        <label><input type="checkbox" data-p="quality.enabled.bright_clip">启用高光溢出</label>
        <label><input type="checkbox" data-p="quality.enabled.contrast">启用对比度</label>
        <label><input type="checkbox" data-p="quality.enabled.entropy">启用细节量</label>
        <label><input type="checkbox" data-p="quality.enabled.resolution">启用分辨率</label>
        <label><input type="checkbox" data-p="quality.enabled.file_size">启用文件大小</label>
        <label><input type="checkbox" data-p="similarity.exact_duplicates">检测完全重复</label>
        <label><input type="checkbox" data-p="similarity.allow_cross_time_high_confidence">允许跨时间高置信匹配</label>
        <label><input type="checkbox" data-p="similarity.face_safe">人物照片保守处理</label>
      </div>
      <div id="estimate" class="estimate">每项参数右侧的 ↺ 可恢复到基础模式默认值。调整后可先预估影响。</div>
      <div id="profileSaveStatus" class="profile-save-status hidden" role="status"></div>
      <div class="dialog-actions"><button id="estimateBtn">预估当前项目</button><button id="saveProfile" class="primary">保存自定义模式</button></div>
    </section>
    <footer class="settings-footer">© 2026 Yuumi · Photo Culler <span id="appVersion"></span></footer>
  </dialog>

  <dialog id="confirm" class="confirm"><h2 id="confirmTitle"></h2><div id="confirmBody"></div><footer><button data-close>取消</button><button id="confirmOk" class="danger">确认</button></footer></dialog>
  <dialog id="updateDialog" class="confirm"><h2 id="updateTitle">发现新版本</h2><div id="updateBody"></div><footer><button data-close>以后再说</button><button id="updateDownload" class="primary">下载更新</button></footer></dialog>
  <div id="recentMenu" class="context-menu hidden" role="menu">
    <button id="recentOpenFolder" role="menuitem">在文件管理器中打开</button>
    <button id="recentRemove" class="context-danger" role="menuitem">移除项目</button>
  </div>
  <div id="toast"></div>
  <script>window.APP_TOKEN="__APP_TOKEN__"</script>
  <script src="/static/app.js?v=1.0.0-ui2"></script>
</body>
</html>
